[package]
name = "rtc-shared"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RTC Shared in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc-shared"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["crypto", "ifaces", "marshal", "replay"]
crypto = ["dep:aes-gcm", "dep:rcgen", "dep:sec1", "dep:p256", "dep:aes"]
ifaces = []
marshal = []
replay = []

[dependencies]
thiserror.workspace = true
substring = "1.4.5"
bytes.workspace = true
url = "2.5.0"
rand.workspace = true
serde.workspace = true

# Crypto deps — only pulled in when the "crypto" feature is enabled
aes-gcm = { version = "0.10.3", features = ["std"], optional = true }
rcgen = { workspace = true, optional = true }
sec1 = { version = "0.7.3", features = ["std"], optional = true }
p256 = { version = "0.13.2", features = ["default", "ecdh", "ecdsa"], optional = true }
aes = { version = "0.8.4", optional = true }

[target.'cfg(not(windows))'.dependencies]
nix = "0.26.2"

[target.'cfg(windows)'.dependencies]
bitflags = "1.3"
winapi = { version = "0.3.9", features = [
    "basetsd",
    "guiddef",
    "ws2def",
    "winerror",
    "ws2ipdef",
] }

